<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Stock Trading System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #030712;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            position: relative;
            padding: 2rem 0;
        }

        /* Luxury Floating Stock Elements Background */
        .luxury-bg {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        /* แสงออร่าทองคำและมรกตหรูหรา */
        .gold-orb {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(3, 7, 18, 0) 70%);
            border-radius: 50%;
            top: -15%;
            left: -10%;
            filter: blur(100px);
            animation: floatOrb1 14s infinite alternate ease-in-out;
        }

        .emerald-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, rgba(3, 7, 18, 0) 70%);
            border-radius: 50%;
            bottom: -20%;
            right: -10%;
            filter: blur(100px);
            animation: floatOrb2 16s infinite alternate ease-in-out;
        }

        @keyframes floatOrb1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 60px) scale(1.2); }
        }

        @keyframes floatOrb2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-90px, -70px) scale(1.15); }
        }

        /* ไอคอนหุ้นลอยไปมาเป็นมิติ (Floating Icons) */
        .floating-element {
            position: absolute;
            color: rgba(255, 255, 255, 0.04);
            font-size: 4rem;
            animation: floatSymbol 12s infinite linear;
            pointer-events: none;
        }

        .el-1 { top: 15%; left: 10%; animation-duration: 18s; font-size: 5rem; }
        .el-2 { top: 75%; left: 15%; animation-duration: 22s; animation-direction: reverse; }
        .el-3 { top: 20%; right: 12%; animation-duration: 15s; font-size: 6rem; }
        .el-4 { top: 70%; right: 18%; animation-duration: 20s; animation-direction: reverse; }

        @keyframes floatSymbol {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(8deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }

        /* กล่องฟอร์มแบบพรีเมียมคลาสสิก */
        .card-auth {
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.75rem;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: 0 35px 60px rgba(0, 0, 0, 0.85);
            z-index: 1;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.875rem;
            color: #e2e8f0;
            margin-bottom: 0.4rem;
        }

        .form-control {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff !important;
            border-radius: 0.75rem;
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
        }

        .form-control::placeholder {
            color: #94a3b8 !important;
            opacity: 1;
        }

        .form-control:focus {
            background: rgba(30, 41, 59, 0.95);
            border-color: #d4af37;
            color: #ffffff !important;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.2);
        }

        .input-group-text {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            border-radius: 0.75rem 0 0 0.75rem;
        }

        .btn-luxury {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            border: none;
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-weight: 600;
            color: #fff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-luxury:hover {
            background: linear-gradient(135deg, #e5be425 0%, #88620c 100%);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
            transform: translateY(-2px);
            color: #fff;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #d4af37 0%, #10b981 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: white;
            margin: 0 auto 1.25rem auto;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <!-- พื้นหลังหรูหราพร้อมไอคอนหุ้นลอยตัว -->
    <div class="luxury-bg">
        <div class="gold-orb"></div>
        <div class="emerald-orb"></div>
        <i class="fas fa-chart-line floating-element el-1"></i>
        <i class="fas fa-coins floating-element el-2"></i>
        <i class="fas fa-chart-pie floating-element el-3"></i>
        <i class="fas fa-arrow-trend-up floating-element el-4"></i>
    </div>

    <div class="card-auth">
        <div class="text-center mb-4">
            <div class="brand-icon">
                <i class="fas fa-user-plus"></i>
            </div>
            <h3 class="fw-bold text-white tracking-wide">Create Account</h3>
            <p class="text-light small opacity-75">สมัครสมาชิกเพื่อเริ่มต้นใช้งานระบบพอร์ตลงทุน</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} bg-opacity-10 border-0 text-{{ 'danger' if category == 'danger' else 'success' }} py-2 px-3 small rounded-3 mb-3" role="alert">
                <i class="fas fa-info-circle me-2"></i>{{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register_page') }}" onsubmit="return validatePassword()">
            <!-- ชื่อผู้ใช้ -->
            <div class="mb-3">
                <label for="username" class="form-label">ชื่อผู้ใช้ (Username)</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="fas fa-user"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" name="username" required placeholder="ตั้งชื่อผู้ใช้ของคุณ" style="border-radius: 0 0.75rem 0.75rem 0;">
                </div>
            </div>

            <!-- อีเมล -->
            <div class="mb-3">
                <label for="email" class="form-label">อีเมล (Email)</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control border-start-0" id="email" name="email" required placeholder="name@example.com" style="border-radius: 0 0.75rem 0.75rem 0;">
                </div>
            </div>

            <!-- รหัสผ่าน -->
            <div class="mb-3">
                <label for="password" class="form-label">รหัสผ่าน (Password)</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" name="password" required placeholder="••••••••" style="border-radius: 0 0.75rem 0.75rem 0;">
                </div>
            </div>

            <!-- ยืนยันรหัสผ่าน -->
            <div class="mb-4">
                <label for="confirm_password" class="form-label">ยืนยันรหัสผ่าน (Confirm Password)</label>
                <div class="input-group">
                    <span class="input-group-text border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="confirm_password" required placeholder="••••••••" style="border-radius: 0 0.75rem 0.75rem 0;">
                </div>
            </div>

            <button type="submit" class="btn btn-luxury w-100 mb-3">ลงทะเบียน</button>
        </form>

        <div class="text-center">
            <p class="text-light small opacity-75 mb-0">มีบัญชีอยู่แล้ว? <a href="{{ url_for('login_page') }}" class="text-warning text-decoration-none fw-semibold">เข้าสู่ระบบ</a></p>
        </div>
    </div>

    <!-- JavaScript ตรวจสอบรหัสผ่านตรงกันไหม -->
    <script>
        function validatePassword() {
            var pass = document.getElementById("password").value;
            var confirmPass = document.getElementById("confirm_password").value;
            if (pass !== confirmPass) {
                alert("รหัสผ่านและการยืนยันรหัสผ่านไม่ตรงกัน!");
                return false;
            }
            return true;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
